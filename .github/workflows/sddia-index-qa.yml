name: sddia-index-qa

# Push solo en main. Un commit en otra rama no entra aquí.
# El PR (opened/synchronize) sí corre, una vez: el grupo es el número de PR.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

env:
  WASMTIME_VERSION: v48.0.1
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_PROFILE_DEV_STRIP: debuginfo

jobs:
  changes:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      lance_memory: ${{ steps.classify.outputs.lance_memory }}
      linear_e2e: ${{ steps.classify.outputs.linear_e2e }}
      installer: ${{ steps.classify.outputs.installer }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify diff (PR) or full suite (push main)
        id: classify
        run: bash SddIA/scripts/qa/classify-sddia-index-qa-changes.sh

  # ---------------------------------------------------------------------
  # Compilación. Los checks de abajo no compilan: descargan estos bins.
  # Un fallo de un check no marca el otro. Si el build falla, los checks
  # que lo necesitan se omiten.
  # ---------------------------------------------------------------------
  native-build:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install protoc (lance-encoding)
        run: sudo apt-get update -o Acquire::Languages=none && sudo apt-get install -y --no-install-recommends protobuf-compiler libprotobuf-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "SddIA -> target"
          shared-key: native-debug
          add-job-id-key: "false"
          cache-workspace-crates: "true"

      - name: Build native workspace
        working-directory: SddIA
        run: cargo build --workspace

      - name: Stage native bins
        run: bash SddIA/scripts/qa/stage-native-debug-bins.sh

      - name: Upload native bins
        uses: actions/upload-artifact@v4
        with:
          name: native-debug-bins
          retention-days: 1
          if-no-files-found: error
          path: SddIA/target/native-debug-bins/

  wasi-build:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install protoc (lance-encoding)
        run: sudo apt-get update -o Acquire::Languages=none && sudo apt-get install -y --no-install-recommends protobuf-compiler libprotobuf-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1

      - name: Cache wasmtime
        id: cache-wasmtime
        uses: actions/cache@v4
        with:
          path: ~/.wasmtime/bin
          key: wasmtime-${{ runner.os }}-${{ env.WASMTIME_VERSION }}

      - name: Download wasmtime if not cached
        if: steps.cache-wasmtime.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64) arch="x86_64-linux" ;;
            aarch64|arm64) arch="aarch64-linux" ;;
            *) echo "unsupported arch: $(uname -m)" >&2; exit 1 ;;
          esac
          dest="$HOME/.wasmtime/bin"
          mkdir -p "$dest"
          tarball="wasmtime-${WASMTIME_VERSION}-${arch}.tar.xz"
          url="https://github.com/bytecodealliance/wasmtime/releases/download/${WASMTIME_VERSION}/${tarball}"
          curl -sSfL "$url" -o "/tmp/${tarball}"
          tar -xJf "/tmp/${tarball}" -C /tmp
          install -m 755 "/tmp/wasmtime-${WASMTIME_VERSION}-${arch}/wasmtime" "$dest/wasmtime"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "SddIA -> target"
          shared-key: wasi-e2e
          add-job-id-key: "false"
          cache-workspace-crates: "true"

      - name: Build WASI capsules (skills/tools)
        run: SddIA/scripts/qa/build-wasi-capsules.sh

      - name: Build nativos (centinelas + orquestador + QA + linear adapter)
        working-directory: SddIA
        run: |
          cargo build -p event-watcher -p execute-process -p sddia-qa
          cargo build --release -p linear-tracker-adapter

      - name: Stage WASI runtime artifact (wasm only + native bins)
        run: |
          set -euo pipefail
          stage="SddIA/target/wasi-runtime-artifact"
          rm -rf "$stage"
          mkdir -p "$stage/wasm32-wasip1/debug" "$stage/debug" "$stage/release"
          shopt -s nullglob
          for wasm in SddIA/target/wasm32-wasip1/debug/*.wasm; do
            cp "$wasm" "$stage/wasm32-wasip1/debug/"
          done
          cp SddIA/target/debug/sddia-qa SddIA/target/debug/event-watcher SddIA/target/debug/execute-process "$stage/debug/"
          cp SddIA/target/release/linear-tracker-adapter "$stage/release/"

      - name: Upload WASI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wasi-runtime
          retention-days: 1
          if-no-files-found: error
          path: SddIA/target/wasi-runtime-artifact/

  # ---------------------------------------------------------------------
  # Checks. El nombre del check es el id del job (protección de rama).
  # ---------------------------------------------------------------------
  sddia-index-integrity:
    needs: [native-build, changes]
    if: >-
      needs.native-build.result == 'success' &&
      needs.changes.result == 'success' &&
      (github.event_name == 'pull_request' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: native-debug-bins
          path: SddIA/target/debug

      - name: Verify tools, processes & capsules
        run: |
          chmod +x SddIA/target/debug/sddia-qa SddIA/target/debug/event-watcher SddIA/target/debug/execute-process SddIA/target/debug/iota-immutable-publisher
          SddIA/target/debug/sddia-qa verify-tools-index
          SddIA/target/debug/sddia-qa verify-process-integrity
          SddIA/target/debug/sddia-qa verify-compiled-capsules

      - name: Install protoc (lance-encoding)
        if: needs.changes.outputs.lance_memory == 'true'
        run: sudo apt-get update -o Acquire::Languages=none && sudo apt-get install -y --no-install-recommends protobuf-compiler libprotobuf-dev

      - uses: dtolnay/rust-toolchain@stable
        if: needs.changes.outputs.lance_memory == 'true'

      - uses: Swatinem/rust-cache@v2
        if: needs.changes.outputs.lance_memory == 'true'
        with:
          workspaces: "SddIA -> target"
          shared-key: native-test-lance
          add-job-id-key: "false"
          cache-workspace-crates: "true"

      - name: Evolution-register & LanceDB integration tests
        if: needs.changes.outputs.lance_memory == 'true'
        working-directory: SddIA
        run: |
          cargo test -p sddia-evolution-register -p sddia-core-memory -p sddia-infrastructure-lancedb-thought -p sddia-infrastructure-lancedb-evolution -p execute-process --test memory_evolution_ingest

  eda-iota-smoke-simulate:
    needs: native-build
    if: >-
      needs.native-build.result == 'success' &&
      (github.event_name == 'pull_request' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: native-debug-bins
          path: SddIA/target/debug

      - name: run-iota-ci-smoke (simulate)
        env:
          SDDIA_LAB_SIMULATE_IOTA: "1"
        run: |
          chmod +x SddIA/target/debug/sddia-qa SddIA/target/debug/event-watcher SddIA/target/debug/execute-process SddIA/target/debug/iota-immutable-publisher
          SddIA/target/debug/sddia-qa run-iota-ci-smoke --simulate --json

  eda-iota-physical:
    needs: native-build
    if: >-
      needs.native-build.result == 'success' &&
      (github.event_name == 'pull_request' || github.ref == 'refs/heads/main') &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: native-debug-bins
          path: SddIA/target/debug

      - name: run-iota-ci-smoke (physical)
        env:
          IOTA_WALLET_SECRET: ${{ secrets.IOTA_WALLET_SECRET }}
        run: |
          if [ -z "${IOTA_WALLET_SECRET}" ]; then
            echo "IOTA_WALLET_SECRET no configurado — omitiendo anclaje físico Testnet"
            exit 0
          fi
          chmod +x SddIA/target/debug/sddia-qa SddIA/target/debug/event-watcher SddIA/target/debug/execute-process SddIA/target/debug/iota-immutable-publisher
          SddIA/target/debug/sddia-qa run-iota-ci-smoke --require-physical --json

  wasi-runtime-smoke:
    needs: wasi-build
    if: >-
      needs.wasi-build.result == 'success' &&
      (github.event_name == 'pull_request' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache wasmtime
        id: cache-wasmtime
        uses: actions/cache@v4
        with:
          path: ~/.wasmtime/bin
          key: wasmtime-${{ runner.os }}-${{ env.WASMTIME_VERSION }}

      - name: Download wasmtime if not cached
        if: steps.cache-wasmtime.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64) arch="x86_64-linux" ;;
            aarch64|arm64) arch="aarch64-linux" ;;
            *) echo "unsupported arch: $(uname -m)" >&2; exit 1 ;;
          esac
          dest="$HOME/.wasmtime/bin"
          mkdir -p "$dest"
          tarball="wasmtime-${WASMTIME_VERSION}-${arch}.tar.xz"
          url="https://github.com/bytecodealliance/wasmtime/releases/download/${WASMTIME_VERSION}/${tarball}"
          curl -sSfL "$url" -o "/tmp/${tarball}"
          tar -xJf "/tmp/${tarball}" -C /tmp
          install -m 755 "/tmp/wasmtime-${WASMTIME_VERSION}-${arch}/wasmtime" "$dest/wasmtime"

      - name: Add wasmtime to PATH
        run: echo "$HOME/.wasmtime/bin" >> "$GITHUB_PATH"

      - uses: actions/download-artifact@v4
        with:
          name: wasi-runtime
          path: wasi-runtime

      - name: Place WASI artifacts
        run: |
          set -euo pipefail
          mkdir -p SddIA/target/wasm32-wasip1/debug SddIA/target/debug SddIA/target/release
          cp -a wasi-runtime/wasm32-wasip1/debug/. SddIA/target/wasm32-wasip1/debug/
          cp -a wasi-runtime/debug/. SddIA/target/debug/
          cp -a wasi-runtime/release/. SddIA/target/release/
          chmod +x SddIA/target/debug/sddia-qa SddIA/target/debug/event-watcher SddIA/target/debug/execute-process SddIA/target/release/linear-tracker-adapter

      - name: WASI CI smoke
        env:
          SDDIA_CI_REQUIRE_WASI: "1"
          SDDIA_LAB_SIMULATE_IOTA: "1"
          SDDIA_LAB_SIMULATE_SYNC_INDEX: "1"
          SDDIA_LAB_ROUTE_SYNC: "1"
        run: SddIA/target/debug/sddia-qa run-wasi-ci-smoke --json

      - name: Evolution gate (delta & universe)
        run: |
          git fetch --no-tags origin main
          SddIA/target/debug/sddia-qa gate-evolution --json --range --require-synced-base
          SddIA/target/debug/sddia-qa gate-evolution --json --all

  eda-bus-e2e-smoke:
    needs: [wasi-build, changes]
    if: >-
      needs.wasi-build.result == 'success' &&
      needs.changes.result == 'success' &&
      (github.event_name == 'pull_request' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install protoc (lance-encoding)
        if: needs.changes.outputs.linear_e2e == 'true'
        run: sudo apt-get update -o Acquire::Languages=none && sudo apt-get install -y --no-install-recommends protobuf-compiler libprotobuf-dev

      - name: Cache wasmtime
        id: cache-wasmtime
        uses: actions/cache@v4
        with:
          path: ~/.wasmtime/bin
          key: wasmtime-${{ runner.os }}-${{ env.WASMTIME_VERSION }}

      - name: Download wasmtime if not cached
        if: steps.cache-wasmtime.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64) arch="x86_64-linux" ;;
            aarch64|arm64) arch="aarch64-linux" ;;
            *) echo "unsupported arch: $(uname -m)" >&2; exit 1 ;;
          esac
          dest="$HOME/.wasmtime/bin"
          mkdir -p "$dest"
          tarball="wasmtime-${WASMTIME_VERSION}-${arch}.tar.xz"
          url="https://github.com/bytecodealliance/wasmtime/releases/download/${WASMTIME_VERSION}/${tarball}"
          curl -sSfL "$url" -o "/tmp/${tarball}"
          tar -xJf "/tmp/${tarball}" -C /tmp
          install -m 755 "/tmp/wasmtime-${WASMTIME_VERSION}-${arch}/wasmtime" "$dest/wasmtime"

      - name: Add wasmtime to PATH
        run: echo "$HOME/.wasmtime/bin" >> "$GITHUB_PATH"

      - uses: actions/download-artifact@v4
        with:
          name: wasi-runtime
          path: wasi-runtime

      - name: Place WASI artifacts
        run: |
          set -euo pipefail
          mkdir -p SddIA/target/wasm32-wasip1/debug SddIA/target/debug SddIA/target/release
          cp -a wasi-runtime/wasm32-wasip1/debug/. SddIA/target/wasm32-wasip1/debug/
          cp -a wasi-runtime/debug/. SddIA/target/debug/
          cp -a wasi-runtime/release/. SddIA/target/release/
          chmod +x SddIA/target/debug/sddia-qa SddIA/target/debug/event-watcher SddIA/target/debug/execute-process SddIA/target/release/linear-tracker-adapter

      - uses: dtolnay/rust-toolchain@stable
        if: needs.changes.outputs.linear_e2e == 'true'

      - uses: Swatinem/rust-cache@v2
        if: needs.changes.outputs.linear_e2e == 'true'
        with:
          workspaces: "SddIA -> target"
          shared-key: native-test-lance
          add-job-id-key: "false"
          cache-workspace-crates: "true"

      - name: EDA E2E lab (simulate/mock)
        env:
          SDDIA_LAB_SIMULATE_IOTA: "1"
          SDDIA_LAB_SIMULATE_SYNC_INDEX: "1"
          SDDIA_LAB_ROUTE_SYNC: "1"
        run: SddIA/target/debug/sddia-qa run-eda-e2e-lab --entity-class tool --json

      - name: Linear E2E labs (mock)
        if: needs.changes.outputs.linear_e2e == 'true'
        env:
          SDDIA_LAB_SIMULATE_IOTA: "1"
          SDDIA_LAB_SIMULATE_SYNC_INDEX: "1"
          SDDIA_LAB_ROUTE_SYNC: "1"
        run: |
          SddIA/target/debug/sddia-qa run-linear-direct-cycle-e2e-lab --json
          SddIA/target/debug/sddia-qa run-linear-done-gate-both-e2e-lab --json

  sddia-diff-digest:
    needs: native-build
    if: >-
      needs.native-build.result == 'success' &&
      github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: native-debug-bins
          path: SddIA/target/debug

      - name: Fetch base branch for merge-base
        run: git fetch --no-tags origin "${{ github.base_ref }}"

      - name: verify-diff-digest (AUT-40)
        run: |
          chmod +x SddIA/target/debug/sddia-qa
          SddIA/target/debug/sddia-qa verify-diff-digest --json \
            --head "${{ github.event.pull_request.head.sha }}" \
            --target-branch "${{ github.base_ref }}"
