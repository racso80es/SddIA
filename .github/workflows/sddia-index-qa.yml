name: sddia-index-qa

on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
  pull_request:
    branches:
      - main
      - "feat/**"
      - "fix/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

permissions:
  contents: read

# Pin: install.sh (latest via GitHub API) parsea `{` bajo rate-limit y sale 0.
# Empiría PR #239 job wasi-runtime-smoke: Wasmtime ({) → URL inválida → wasmtime not in PATH.
env:
  WASMTIME_VERSION: v48.0.1

jobs:
  sddia-index-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install protoc (lance-encoding)
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            SddIA/target
          key: native-${{ runner.os }}-${{ hashFiles('SddIA/Cargo.lock') }}
          restore-keys: |
            native-${{ runner.os }}-
      - name: Build QA aduana (execute-process + sddia-qa)
        run: |
          cd SddIA
          cargo build -p execute-process
          cargo build -p sddia-qa
      - name: verify-tools-index
        run: SddIA/target/debug/sddia-qa verify-tools-index
      - name: verify-process-integrity
        run: SddIA/target/debug/sddia-qa verify-process-integrity
      - name: evolution-register unit tests
        run: cargo test -p sddia-evolution-register --manifest-path SddIA/Cargo.toml
      - name: verify-compiled-capsules
        run: |
          cd SddIA
          cargo build --workspace
          target/debug/sddia-qa verify-compiled-capsules
      - name: LanceDB memory integration tests
        run: |
          cd SddIA
          cargo test -p sddia-core-memory
          cargo test -p sddia-infrastructure-lancedb-thought
          cargo test -p sddia-infrastructure-lancedb-evolution
          cargo test -p execute-process -- memory_evolution_ingest json_fallback

  eda-iota-smoke-simulate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install protoc (lance-encoding)
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            SddIA/target
          key: native-${{ runner.os }}-${{ hashFiles('SddIA/Cargo.lock') }}
          restore-keys: |
            native-${{ runner.os }}-
      - name: Build centinelas + orquestador + publisher + QA
        run: |
          cd SddIA
          cargo build -p event-watcher
          cargo build -p execute-process
          cargo build -p iota-immutable-publisher
          cargo build -p sddia-qa
      - name: run-iota-ci-smoke (simulate)
        env:
          SDDIA_LAB_SIMULATE_IOTA: "1"
        run: SddIA/target/debug/sddia-qa run-iota-ci-smoke --simulate --json

  wasi-runtime-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install protoc (lance-encoding)
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
      - name: Install wasmtime
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64) arch="x86_64-linux" ;;
            aarch64|arm64) arch="aarch64-linux" ;;
            *) echo "unsupported arch: $(uname -m)" >&2; exit 1 ;;
          esac
          dest="$HOME/.wasmtime/bin"
          mkdir -p "$dest"
          tarball="wasmtime-${WASMTIME_VERSION}-${arch}.tar.xz"
          url="https://github.com/bytecodealliance/wasmtime/releases/download/${WASMTIME_VERSION}/${tarball}"
          curl -sSfL "$url" -o "/tmp/${tarball}"
          tar -xJf "/tmp/${tarball}" -C /tmp
          install -m 755 "/tmp/wasmtime-${WASMTIME_VERSION}-${arch}/wasmtime" "$dest/wasmtime"
          echo "$dest" >> "$GITHUB_PATH"
          "$dest/wasmtime" --version
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            SddIA/target
          key: wasi-${{ runner.os }}-${{ hashFiles('SddIA/Cargo.lock') }}
          restore-keys: |
            wasi-${{ runner.os }}-
      - name: Build WASI capsules (skills/tools; exclude native daemons)
        run: SddIA/scripts/qa/build-wasi-capsules.sh
      - name: Build nativos (centinelas + orquestador + QA)
        run: |
          cd SddIA
          cargo build -p event-watcher
          cargo build -p execute-process
          cargo build -p sddia-qa
      - name: WASI CI smoke
        env:
          SDDIA_CI_REQUIRE_WASI: "1"
          SDDIA_LAB_SIMULATE_IOTA: "1"
          SDDIA_LAB_SIMULATE_SYNC_INDEX: "1"
          SDDIA_LAB_ROUTE_SYNC: "1"
        run: SddIA/target/debug/sddia-qa run-wasi-ci-smoke --json
      - name: evolution gate (delta)
        run: |
          git fetch --no-tags origin main
          cargo test -p sddia-evolution-register --manifest-path SddIA/Cargo.toml
          SddIA/target/debug/sddia-qa gate-evolution --json --range --require-synced-base
      - name: evolution gate (universe)
        run: SddIA/target/debug/sddia-qa gate-evolution --json --all

  eda-bus-e2e-smoke:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Install protoc (lance-encoding)
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
      - name: Install wasmtime
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64) arch="x86_64-linux" ;;
            aarch64|arm64) arch="aarch64-linux" ;;
            *) echo "unsupported arch: $(uname -m)" >&2; exit 1 ;;
          esac
          dest="$HOME/.wasmtime/bin"
          mkdir -p "$dest"
          tarball="wasmtime-${WASMTIME_VERSION}-${arch}.tar.xz"
          url="https://github.com/bytecodealliance/wasmtime/releases/download/${WASMTIME_VERSION}/${tarball}"
          curl -sSfL "$url" -o "/tmp/${tarball}"
          tar -xJf "/tmp/${tarball}" -C /tmp
          install -m 755 "/tmp/wasmtime-${WASMTIME_VERSION}-${arch}/wasmtime" "$dest/wasmtime"
          echo "$dest" >> "$GITHUB_PATH"
          "$dest/wasmtime" --version
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            SddIA/target
          key: wasi-${{ runner.os }}-${{ hashFiles('SddIA/Cargo.lock') }}
          restore-keys: |
            wasi-${{ runner.os }}-
      - name: Build WASI capsules (skills/tools; exclude native daemons)
        run: SddIA/scripts/qa/build-wasi-capsules.sh
      - name: Build nativos (centinelas + orquestador + QA)
        run: |
          cd SddIA
          cargo build -p event-watcher
          cargo build -p execute-process
          cargo build -p sddia-qa
      - name: EDA E2E lab (simulate)
        env:
          SDDIA_LAB_SIMULATE_IOTA: "1"
          SDDIA_LAB_SIMULATE_SYNC_INDEX: "1"
          SDDIA_LAB_ROUTE_SYNC: "1"
        run: SddIA/target/debug/sddia-qa run-eda-e2e-lab --entity-class tool --json
      - name: event-sweeper --once (idempotent)
        run: |
          cd SddIA && CARGO_TARGET_DIR=$PWD/target cargo build --release -p event-sweeper
          target/release/event-sweeper --once --json

  eda-iota-physical:
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'pull_request' || github.ref == 'refs/heads/main') &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    steps:
      - uses: actions/checkout@v4
      - name: Install protoc (lance-encoding)
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            SddIA/target
          key: native-${{ runner.os }}-${{ hashFiles('SddIA/Cargo.lock') }}
          restore-keys: |
            native-${{ runner.os }}-
      - name: Build nativos (smoke IOTA físico)
        run: |
          cd SddIA
          cargo build -p event-watcher
          cargo build -p execute-process
          cargo build -p iota-immutable-publisher
          cargo build -p sddia-qa
      - name: run-iota-ci-smoke (physical)
        env:
          IOTA_WALLET_SECRET: ${{ secrets.IOTA_WALLET_SECRET }}
        run: |
          if [ -z "${IOTA_WALLET_SECRET}" ]; then
            echo "IOTA_WALLET_SECRET no configurado — omitiendo anclaje físico Testnet"
            exit 0
          fi
          SddIA/target/debug/sddia-qa run-iota-ci-smoke --require-physical --json
