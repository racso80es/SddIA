name: sddia-index-qa

on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
  pull_request:
    branches:
      - main
      - "feat/**"
      - "fix/**"

permissions:
  contents: read

jobs:
  verify-tools-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            SddIA/target
          key: native-${{ runner.os }}-${{ hashFiles('SddIA/Cargo.lock') }}
          restore-keys: |
            native-${{ runner.os }}-
      - name: Build execute-process (frontmatter parser QA)
        run: cd SddIA && cargo build -p execute-process
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: verify-tools-index
        run: python SddIA/scripts/qa/verify-tools-index.py
      - name: verify-process-integrity
        run: python SddIA/scripts/qa/verify-process-integrity.py

  eda-iota-smoke-simulate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            SddIA/target
          key: native-${{ runner.os }}-${{ hashFiles('SddIA/Cargo.lock') }}
          restore-keys: |
            native-${{ runner.os }}-
      - name: Build centinelas + orquestador (smoke EDA)
        run: |
          cd SddIA
          cargo build -p event-watcher
          cargo build -p execute-process
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: run-iota-ci-smoke (simulate)
        run: python SddIA/scripts/qa/run-iota-ci-smoke.py --simulate --json

  wasi-runtime-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
      - name: Install wasmtime
        run: |
          curl https://wasmtime.dev/install.sh -sSf | bash
          echo "$HOME/.wasmtime/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            SddIA/target
          key: wasi-${{ runner.os }}-${{ hashFiles('SddIA/Cargo.lock') }}
          restore-keys: |
            wasi-${{ runner.os }}-
      - name: Build WASI workspace
        run: cd SddIA && cargo build --workspace --target wasm32-wasip1
      - name: Build nativos (centinelas + orquestador)
        run: |
          cd SddIA
          cargo build -p event-watcher
          cargo build -p execute-process
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: WASI CI smoke
        env:
          SDDIA_CI_REQUIRE_WASI: "1"
          SDDIA_LAB_SIMULATE_IOTA: "1"
          SDDIA_LAB_SIMULATE_SYNC_INDEX: "1"
          SDDIA_LAB_ROUTE_SYNC: "1"
        run: python SddIA/scripts/qa/run-wasi-ci-smoke.py --json

  eda-bus-e2e-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
      - name: Install wasmtime
        run: |
          curl https://wasmtime.dev/install.sh -sSf | bash
          echo "$HOME/.wasmtime/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            SddIA/target
          key: wasi-${{ runner.os }}-${{ hashFiles('SddIA/Cargo.lock') }}
          restore-keys: |
            wasi-${{ runner.os }}-
      - name: Build WASI workspace
        run: cd SddIA && cargo build --workspace --target wasm32-wasip1
      - name: Build nativos (centinelas + orquestador)
        run: |
          cd SddIA
          cargo build -p event-watcher
          cargo build -p execute-process
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: EDA E2E lab (simulate)
        env:
          SDDIA_LAB_SIMULATE_IOTA: "1"
          SDDIA_LAB_SIMULATE_SYNC_INDEX: "1"
          SDDIA_LAB_ROUTE_SYNC: "1"
        run: python SddIA/scripts/qa/run-eda-e2e-lab.py --entity-class tool --json
      - name: event-sweeper --once (idempotent)
        run: |
          cd SddIA && CARGO_TARGET_DIR=$PWD/target cargo build --release -p event-sweeper
          target/release/event-sweeper --once --json

  eda-iota-physical:
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install iota-immutable-publisher deps
        run: |
          PUB=SddIA/scripts/tools/iota-immutable-publisher
          if [ ! -d "$PUB" ]; then
            echo "iota-immutable-publisher ausente — omitiendo job físico"
            exit 0
          fi
          cd "$PUB" && npm ci
      - name: run-iota-ci-smoke (physical)
        env:
          IOTA_WALLET_SECRET: ${{ secrets.IOTA_WALLET_SECRET }}
        run: |
          if [ -z "${IOTA_WALLET_SECRET}" ]; then
            echo "IOTA_WALLET_SECRET no configurado — omitiendo anclaje físico Testnet"
            exit 0
          fi
          python SddIA/scripts/qa/run-iota-ci-smoke.py --require-physical --json
