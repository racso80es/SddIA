name: sddia-index-qa

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  # Agrupa por PR o por rama; si subes un commit nuevo al PR, cancela el anterior al instante.
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  actions: write

env:
  WASMTIME_VERSION: v48.0.1
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  # =========================================================================
  # JOB 1: Integridad Nativa + LanceDB + IOTA (Simulado y Físico)
  # Compila el workspace UNA sola vez y ejecuta todas las pruebas nativas.
  # =========================================================================
  sddia-native-suite:
    name: Native Integrity & IOTA Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install protoc (lance-encoding)
        run: sudo apt-get update -o Acquire::Languages=none && sudo apt-get install -y --no-install-recommends protobuf-compiler

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "SddIA -> target"
          key: native-workspace

      - name: Build native workspace
        working-directory: SddIA
        run: cargo build --workspace

      - name: Verify tools, processes & capsules
        run: |
          SddIA/target/debug/sddia-qa verify-tools-index
          SddIA/target/debug/sddia-qa verify-process-integrity
          SddIA/target/debug/sddia-qa verify-compiled-capsules

      - name: Evolution-register & LanceDB integration tests
        working-directory: SddIA
        run: |
          cargo test -p sddia-evolution-register -p sddia-core-memory -p sddia-infrastructure-lancedb-thought -p sddia-infrastructure-lancedb-evolution
          cargo test -p execute-process --test memory_evolution_ingest

      - name: run-iota-ci-smoke (simulate)
        env:
          SDDIA_LAB_SIMULATE_IOTA: "1"
        run: SddIA/target/debug/sddia-qa run-iota-ci-smoke --simulate --json

      - name: run-iota-ci-smoke (physical)
        if: >-
          (github.event_name == 'pull_request' || github.ref == 'refs/heads/main') &&
          (github.event_name != 'pull_request' ||
           github.event.pull_request.head.repo.full_name == github.repository)
        env:
          IOTA_WALLET_SECRET: ${{ secrets.IOTA_WALLET_SECRET }}
        run: |
          if [ -z "${IOTA_WALLET_SECRET}" ]; then
            echo "IOTA_WALLET_SECRET no configurado — omitiendo anclaje físico Testnet"
            exit 0
          fi
          SddIA/target/debug/sddia-qa run-iota-ci-smoke --require-physical --json

  # =========================================================================
  # JOB 2: WASI Runtime + Evolution Gate + EDA Bus E2E
  # Compila las cápsulas WASI y los daemons UNA sola vez para ambos tests.
  # =========================================================================
  wasi-and-eda-e2e-suite:
    name: WASI Runtime & EDA Bus E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install protoc (lance-encoding)
        run: sudo apt-get update -o Acquire::Languages=none && sudo apt-get install -y --no-install-recommends protobuf-compiler

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1

      - name: Install wasmtime (Cached)
        id: cache-wasmtime
        uses: actions/cache@v4
        with:
          path: ~/.wasmtime/bin
          key: wasmtime-${{ runner.os }}-${{ env.WASMTIME_VERSION }}

      - name: Download wasmtime if not cached
        if: steps.cache-wasmtime.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64) arch="x86_64-linux" ;;
            aarch64|arm64) arch="aarch64-linux" ;;
            *) echo "unsupported arch: $(uname -m)" >&2; exit 1 ;;
          esac
          dest="$HOME/.wasmtime/bin"
          mkdir -p "$dest"
          tarball="wasmtime-${WASMTIME_VERSION}-${arch}.tar.xz"
          url="https://github.com/bytecodealliance/wasmtime/releases/download/${WASMTIME_VERSION}/${tarball}"
          curl -sSfL "$url" -o "/tmp/${tarball}"
          tar -xJf "/tmp/${tarball}" -C /tmp
          install -m 755 "/tmp/wasmtime-${WASMTIME_VERSION}-${arch}/wasmtime" "$dest/wasmtime"

      - name: Add wasmtime to PATH
        run: |
          echo "$HOME/.wasmtime/bin" >> "$GITHUB_PATH"
          "$HOME/.wasmtime/bin/wasmtime" --version

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "SddIA -> target"
          key: wasi-and-e2e

      - name: Build WASI capsules (skills/tools)
        run: SddIA/scripts/qa/build-wasi-capsules.sh

      - name: Build nativos (centinelas + orquestador + QA + linear adapter)
        working-directory: SddIA
        run: |
          cargo build -p event-watcher -p execute-process -p sddia-qa
          cargo build --release -p linear-tracker-adapter

      - name: WASI CI smoke
        env:
          SDDIA_CI_REQUIRE_WASI: "1"
          SDDIA_LAB_SIMULATE_IOTA: "1"
          SDDIA_LAB_SIMULATE_SYNC_INDEX: "1"
          SDDIA_LAB_ROUTE_SYNC: "1"
        run: SddIA/target/debug/sddia-qa run-wasi-ci-smoke --json

      - name: Evolution gate (delta & universe)
        run: |
          git fetch --no-tags origin main
          cargo test -p sddia-evolution-register --manifest-path SddIA/Cargo.toml
          SddIA/target/debug/sddia-qa gate-evolution --json --range --require-synced-base
          SddIA/target/debug/sddia-qa gate-evolution --json --all

      - name: EDA E2E & Linear labs (simulate/mock)
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
        env:
          SDDIA_LAB_SIMULATE_IOTA: "1"
          SDDIA_LAB_SIMULATE_SYNC_INDEX: "1"
          SDDIA_LAB_ROUTE_SYNC: "1"
        run: |
          SddIA/target/debug/sddia-qa run-eda-e2e-lab --entity-class tool --json
          SddIA/target/debug/sddia-qa run-linear-direct-cycle-e2e-lab --json
          SddIA/target/debug/sddia-qa run-linear-done-gate-both-e2e-lab --json

  # =========================================================================
  # JOB 3: Installer Release Smoke
  # Se mantiene en paralelo porque compila en modo --release.
  # =========================================================================
  sddia-installer-smoke:
    name: Installer Release Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install protoc and expect
        run: sudo apt-get update -o Acquire::Languages=none && sudo apt-get install -y --no-install-recommends protobuf-compiler expect

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "SddIA -> target"
          key: installer-release

      - name: Prebuild release (installer lab AC-4)
        timeout-minutes: 40
        run: bash SddIA/scripts/qa/prep-installer-lab-release.sh

      - name: Installer dry-run smoke
        timeout-minutes: 20
        run: bash SddIA/scripts/qa/test-sddia-installer.sh
