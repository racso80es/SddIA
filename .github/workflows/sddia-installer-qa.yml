name: sddia-installer-qa

# PR y push a main: solo si el commit toca instalador / scripts / orquestador (mismas rutas).
on:
  push:
    branches: [main]
    paths:
      - "sddia-installer.sh"
      - "SddIA/scripts/**"
      - "SddIA/engine/execute-process/**"
      - ".github/workflows/sddia-installer-qa.yml"
  pull_request:
    branches: [main]
    paths:
      - "sddia-installer.sh"
      - "SddIA/scripts/**"
      - "SddIA/engine/execute-process/**"
      - ".github/workflows/sddia-installer-qa.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  sddia-installer-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install protoc and expect
        run: sudo apt-get update -o Acquire::Languages=none && sudo apt-get install -y --no-install-recommends protobuf-compiler libprotobuf-dev expect

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "SddIA -> target"
          shared-key: installer-release
          add-job-id-key: "false"

      - name: Prebuild release (installer lab AC-4)
        timeout-minutes: 40
        run: bash SddIA/scripts/qa/prep-installer-lab-release.sh

      - name: Installer dry-run smoke
        timeout-minutes: 20
        run: bash SddIA/scripts/qa/test-sddia-installer.sh
