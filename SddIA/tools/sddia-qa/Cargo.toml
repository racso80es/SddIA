[package]
name = "sddia-qa"
version = "0.1.0"
edition = "2021"
description = "Aduana QA SddIA — verificadores y smokes CI sin Python"

[[bin]]
name = "sddia-qa"
path = "src/main.rs"

[dependencies]
execute-process = { path = "../../engine/execute-process" }
sddia-evolution-register = { path = "../../skills/sddia-evolution-register" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["clock"] }
regex = "1.10"
serde_yaml = "0.9"

[dev-dependencies]
tempfile = "3.10"
