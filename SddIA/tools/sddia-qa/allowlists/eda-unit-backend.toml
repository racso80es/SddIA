# MAN-37 / L-ALLOWLIST — paths donde backend real (store/FS/Redb) es legítimo
# en capas contract / integration / e2e / legacy. El gate unitario omite estos paths.
#
# Formato: cada entrada es un sufijo o substring de path relativo al repo (separador /).

version = 1
feature = "man-37-eda-test-pyramid"

# Capas integration (crate tests/) y contract suite
path_contains = [
  "/tests/",
  "/tests.rs",
  "contract_suite.rs",
  "eda_store_io_matrix",
  "eda_subscriber_",
  "event_store_writers",
  "memory_evolution_ingest",
  "dlt_telemetry",
]

# Legacy bridge + locus lab + gates
path_suffixes = [
  "eda_port_legacy.rs",
  "eda_port.rs",
  "gate_eda_unit_no_real_backend.rs",
  "gate_event_manager_port.rs",
]

# Crates adapters / host / store (contract + infrastructure)
path_prefixes = [
  "SddIA/sddia-event-store/",
  "SddIA/infrastructure/",
  "SddIA/sddia-event-manager-host/",
]

