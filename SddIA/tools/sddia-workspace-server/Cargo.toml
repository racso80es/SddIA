[package]
name = "sddia-workspace-server"
version = "0.1.0"
edition = "2021"
description = "MCP stdio workspace server — resources + tool adapters"

[[bin]]
name = "sddia-workspace-server"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
uuid = { version = "1", features = ["v4"] }
sddia-core = { path = "../../sddia-core" }
sddia-event-manager-host = { path = "../../sddia-event-manager-host" }
sddia-eda-catalog = { path = "../../sddia-eda-catalog" }

[dev-dependencies]
tempfile = "3"
