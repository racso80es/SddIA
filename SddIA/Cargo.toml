    "tools/read-event-subscriptions",
    "tools/repo-retention-purger",
    "tools/sandbox-breacher",
    "tools/schema-corruptor",
    "tools/sddia-qa",
    "tools/sddia-workspace-server",
    "tools/send-telegram-notification",
    "tools/telegram-gateway",
    "tools/transit-event-payload",
    "tools/wasi-poc",
    "user-preference-core",
]
[profile.dev]
debug = "line-tables-only"
strip = "none"

[profile.dev.package."*"]
debug = false
