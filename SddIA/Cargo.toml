    "sddia-io",
    "sddia-runtime-parity",
    "sddia-eda-catalog",
    "sddia-core",
    "sddia-event-manager-host",
    "ecosystem-health",
    "sddia-daemon-runtime",
    "user-preference-core",
    "core/memory",
    "infrastructure/adapters/lancedb_evolution_repo",
    "infrastructure/adapters/lancedb_thought_repo",
    "infrastructure/adapters/lancedb_preferences_repo",
    "infrastructure/adapters/redb_event_adapter",
