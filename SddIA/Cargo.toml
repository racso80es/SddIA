    "infrastructure/adapters/external_capsule_event_adapter",
    "infrastructure/adapters/fs_event_adapter",
    "infrastructure/adapters/redb_event_adapter",
    "interfaces/kalma2-bridge",
    "sddia-core",
    "sddia-daemon-runtime",
    "sddia-eda-catalog",
    "sddia-event-manager-host",
    "sddia-io",
    "sddia-runtime-parity",
    "skills/antigravity-cli-executor",
    "skills/bus-operator",
    "skills/cryptography-manager",
    "skills/filesystem-manager",
    "skills/git-manager",
    "skills/mayeuta-llm",
    "skills/sddia-evolution-register",
    "skills/shell-executor",
    "skills/user-preference-store",
    "tools/ephemeral-cache-purger",
    "tools/event-bus-audit",
    "tools/file-tracker-adapter",
    "tools/gemini-http-infer",
    "tools/github-raw-fetcher",
    "tools/io-choke",
    "tools/iota-immutable-publisher",
    "tools/linear-tracker-adapter",
    "tools/llm-router",
