[package]
name = "github-bridge-watcher"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "github-bridge-watcher"
path = "src/main.rs"

[dependencies]
sddia-daemon-runtime = { path = "../../sddia-daemon-runtime" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = { version = "2", features = ["json"] }
