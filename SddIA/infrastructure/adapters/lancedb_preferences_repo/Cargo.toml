[package]
name = "sddia-infrastructure-lancedb-preferences"
version = "0.1.0"
edition = "2021"
# Host nativo. Compilar lance-encoding exige `protoc` en PATH (protobuf-compiler).

[dependencies]
user-preference-core = { path = "../../../user-preference-core" }
sddia-core-memory = { path = "../../../core/memory" }
serde_json = "1.0"
lancedb = "=0.37.1"
tokio = { version = "1", features = ["rt-multi-thread"] }
futures = "0.3"

[dev-dependencies]
tempfile = "3.10"
