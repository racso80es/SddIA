[package]
name = "kalma2-bridge"
version = "0.1.0"
edition = "2021"
description = "Puente HTTP Kalma2 — aduana inerte E/S (estático + POST /api/interact + GET /api/status)"

[[bin]]
name = "kalma2-bridge"
path = "src/main.rs"

[dependencies]
tiny_http = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.8", features = ["v4"] }
