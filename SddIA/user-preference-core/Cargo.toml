[package]
name = "user-preference-core"
version = "0.1.0"
edition = "2021"
description = "Store local de preferencias del usuario (UserPreference)"

[dependencies]
chrono = { version = "0.4", features = ["clock"] }
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3.10"
