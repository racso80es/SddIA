[package]
name = "execute-process"
version = "0.1.0"
edition = "2021"
description = "Orquestador nativo SddIA — Aduana Universal de Ejecución"

[[bin]]
name = "execute-process"
path = "src/main.rs"

[dependencies]
sddia-io = { path = "../../sddia-io" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
regex = "1.10"
uuid = { version = "1.8", features = ["v4"] }
chrono = { version = "0.4", features = ["clock"] }
sha2 = "0.10"
jsonschema = { version = "0.26", default-features = false }

[dev-dependencies]
tempfile = "3.10"
