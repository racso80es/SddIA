[package]
name = "sddia-runtime-parity"
version = "0.1.0"
edition = "2021"
description = "Paridad binario/fuente para órganos vivos execute-process y kalma2-bridge"

[dependencies]
hex = "0.4"
regex = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3.10"
