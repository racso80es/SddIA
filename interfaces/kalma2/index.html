<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kalma2 — Cliente SddIA</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="shell">
    <header>
      <h1>Kalma2</h1>
      <p class="tagline">Cliente interactivo PoC — desacoplado de Cursor</p>
    </header>
    <section class="backlog-panel" aria-label="Backlog tracker">
      <h2>Backlog</h2>
      <p id="backlog-notice" class="tagline hidden" role="status">Proyecto sin tracker configurado</p>
      <div class="backlog-filters">
        <label for="backlog-kind">Tipo</label>
        <select id="backlog-kind" aria-label="Filtro tipo backlog">
          <option value="all">Todos</option>
          <option value="hu">HU</option>
          <option value="pbi">PBI</option>
        </select>
        <label for="backlog-state">Estado</label>
        <select id="backlog-state" aria-label="Filtro estado backlog">
          <option value="">— cualquiera —</option>
          <option value="backlog">backlog</option>
          <option value="in_progress">in_progress</option>
          <option value="in_review">in_review</option>
          <option value="done">done</option>
          <option value="cancelled">cancelled</option>
        </select>
        <button type="button" id="backlog-refresh" class="secondary">Recargar backlog</button>
      </div>
      <ul id="backlog-list" class="backlog-list" aria-live="polite"></ul>
    </section>
    <label for="project-select">Proyecto (opcional)</label>
    <select id="project-select" aria-label="Proyecto registrado">
      <option value="">— Core (sin proyecto) —</option>
    </select>
    <label for="prompt">Prompt</label>
    <textarea id="prompt" rows="8" placeholder="Indica tu intención…"></textarea>
    <div class="actions">
      <button type="button" id="chat">Chat</button>
      <button type="button" id="aiua-pulse">Hablar con Tormentosa</button>
      <button type="button" id="forge" class="secondary">Forjar Proceso</button>
      <button type="button" id="sync-genome" class="secondary">Sincronizar Genoma</button>
      <span id="status" class="status" aria-live="polite"></span>
    </div>
    <section class="cognitive-pulse" aria-label="Pulso cognitivo">
      <h2>Pulso cognitivo</h2>
      <div id="cognitive-pulse" class="cognitive-panel">
        <span id="cognitive-tokens">— tokens</span>
        <span id="cognitive-model">modelo: —</span>
        <span id="cognitive-latency">latencia: —</span>
        <span id="cognitive-quota" class="cognitive-quota hidden" role="status">cuota elevada</span>
      </div>
    </section>
    <section class="consciousness-mirror" aria-label="Espejo de consciencia">
      <h2>Espejo de consciencia</h2>
      <p id="health-map-status" class="health-map-status" role="status"></p>
      <div id="health-matrix" class="health-matrix" aria-live="polite"></div>
    </section>
    <label for="output">Respuesta</label>
    <textarea id="output" rows="8" readonly placeholder="La salida aparecerá aquí…"></textarea>
    <label for="progress-console">Consola de progreso</label>
    <div id="progress-console" class="progress-console" aria-live="polite" role="log"></div>
    <section class="inbox" aria-label="Correo accionable">
      <h2>Umbral de correo</h2>
      <p class="tagline">Solo veredictos <code>actionable</code>. Ruido silenciado.</p>
      <div id="email-inbox" class="inbox-list"></div>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
